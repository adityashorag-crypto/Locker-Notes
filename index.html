<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locker Notes — Homework Help &amp; Advice, By an 8th Grader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--paper:#F2F6EC;
--paper-line:#DCE8D0;
--panel:#FFFFFF;
--ink:#1C2B3A;
--ink-soft:#51616F;
--highlighter:#FFD23F;
--blue:#3E8EDE;
--green:#4CAF7D;
--coral:#E8543E;
--mustard:#CE9A25;
--purple:#8B6FCE;
--radius:14px;
--shadow:0 6px 18px rgba(28,43,58,0.08);
--mono:'JetBrains Mono', ui-monospace, monospace;
--sans:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
html{scroll-behavior:auto;}
*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
body{
margin:0;
background:
linear-gradient(var(--paper-line) 1px, transparent 1px);
background-size: 100% 32px;
background-color:var(--paper);
color:var(--ink);
font-family:var(--sans);
line-height:1.5;
-webkit-font-smoothing:antialiased;
}
a{color:var(--blue);}
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
outline:3px solid var(--blue);
outline-offset:2px;
border-radius:4px;
}
.wrap{max-width:920px; margin:0 auto; padding:0 24px;}

/* ---------- Header : spiral notebook edge ---------- */
header{
background:var(--ink);
color:var(--paper);
padding-top:22px;
position:relative;
}
.spiral{
height:26px;
background-image: radial-gradient(circle 6px, var(--paper) 5px, transparent 5.5px);
background-size:34px 26px;
background-position: 17px center;
background-repeat:repeat-x;
background-color:var(--ink);
}
.thread{
height:4px;
background:linear-gradient(90deg, var(--blue), var(--green), var(--mustard), var(--coral), var(--purple));
}
.header-inner{
display:flex; align-items:center; justify-content:space-between;
padding:18px 24px 26px;
max-width:920px; margin:0 auto;
flex-wrap:wrap; gap:12px;
}
.brand{
display:flex; align-items:baseline; gap:10px;
}
.brand-tab{
font-family:var(--mono); font-weight:800; font-size:1.15rem;
background:var(--highlighter); color:var(--ink);
padding:6px 12px; border-radius:6px;
transform:rotate(-2deg);
box-shadow:var(--shadow);
}
.brand-sub{ font-family:var(--mono); font-size:0.75rem; color:#B9C6CF; letter-spacing:0.04em;}
nav{display:flex; gap:22px; font-family:var(--mono); font-size:0.85rem;}
nav a{color:var(--paper); text-decoration:none; border-bottom:2px solid transparent; padding-bottom:2px; transition:border-color 0.2s ease, color 0.2s ease;}
nav a:hover{border-bottom-color:var(--highlighter);}

/* ---------- Hero ---------- */
.hero{padding:64px 0 48px; position:relative; overflow:hidden;}
.hero::before{
content:"";
position:absolute; top:-60px; right:-40px; width:220px; height:220px;
background:radial-gradient(circle, rgba(139,111,206,0.16), transparent 70%);
z-index:0; pointer-events:none;
}
.hero::after{
content:"";
position:absolute; bottom:-40px; left:-60px; width:200px; height:200px;
background:radial-gradient(circle, rgba(76,175,125,0.14), transparent 70%);
z-index:0; pointer-events:none;
}
.hero > *{position:relative; z-index:1;}
.eyebrow{
font-family:var(--mono); font-size:0.8rem; color:var(--blue);
letter-spacing:0.08em; text-transform:uppercase; margin:0 0 14px; font-weight:700;
}
h1{
font-family:var(--mono); font-weight:800;
font-size:clamp(2rem, 5vw, 3.2rem);
line-height:1.08; margin:0 0 18px; letter-spacing:-0.01em;
}
h1 .hl{
background:linear-gradient(transparent 62%, var(--highlighter) 62%);
}
.hero p{
font-size:1.08rem; color:var(--ink-soft); max-width:52ch; margin:0 0 28px;
}
.cta-row{display:flex; gap:14px; flex-wrap:wrap;}
.btn{
font-family:var(--mono); font-weight:700; font-size:0.9rem;
padding:13px 22px; border-radius:8px; text-decoration:none;
border:2px solid var(--ink); cursor:pointer; display:inline-block;
transition:transform 0.15s ease, filter 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.btn-solid{background:linear-gradient(120deg, var(--blue), var(--purple)); color:#fff; border-color:transparent;}
.btn-solid:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--ink);}
.btn-ghost:hover{background:rgba(62,142,222,0.08); border-color:var(--blue); color:var(--blue);}
section{padding:52px 0;}
.section-head{margin-bottom:28px; max-width:60ch;}
.section-head h2{
font-family:var(--mono); font-size:clamp(1.5rem,3vw,2rem); margin:0 0 8px;
}
.section-head p{color:var(--ink-soft); margin:0;}
#quick .section-head h2{color:var(--blue);}
#help .section-head h2{color:var(--green);}
#advice .section-head h2{color:var(--purple);}

/* ---------- Quick Answers ---------- */
.search-wrap{
background:var(--panel); border-radius:var(--radius);
box-shadow:var(--shadow); padding:26px 26px 22px;
border-top:4px solid var(--blue);
}
.search-input{
width:100%; font-family:var(--sans); font-size:1.05rem;
padding:14px 16px; border-radius:10px; border:2px solid var(--paper-line);
background:var(--paper); color:var(--ink);
}
.search-input:focus{border-color:var(--blue); outline:none;}
.search-hint{font-family:var(--mono); font-size:0.78rem; color:var(--ink-soft); margin:10px 0 0;}
.search-trust{font-family:var(--mono); font-size:0.78rem; color:var(--green); margin:4px 0 0; font-weight:700;}
.qa-results{display:grid; gap:16px; margin-top:20px;}
.qa-item{border-left:4px solid var(--blue); padding:8px 12px 8px 16px; border-radius:0 8px 8px 0;}
.qa-item[data-tag="math"]{border-color:var(--blue); background:rgba(62,142,222,0.05);}
.qa-item[data-tag="sci"]{border-color:var(--green); background:rgba(76,175,125,0.06);}
.qa-item[data-tag="eng"]{border-color:var(--coral); background:rgba(232,84,62,0.05);}
.qa-item[data-tag="hist"]{border-color:var(--mustard); background:rgba(206,154,37,0.06);}
.qa-item[data-tag="life"]{border-color:var(--purple); background:rgba(139,111,206,0.06);}
.qa-item .q{font-family:var(--mono); font-weight:700; font-size:0.95rem; margin:0 0 4px;}
.qa-item .a{margin:0; color:var(--ink-soft); font-size:0.95rem;}
.qa-empty{font-size:0.95rem; color:var(--ink-soft); padding:8px 4px;}
.qa-empty a{color:var(--blue); font-weight:600;}

/* ---------- Binder tabs (Homework Help) ---------- */
.tabbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:0;}
.tab-btn{
font-family:var(--mono); font-weight:700; font-size:0.85rem;
padding:12px 18px 10px; border:none; cursor:pointer;
border-radius:10px 10px 0 0;
background:#E4EADB; color:var(--ink-soft);
position:relative; top:2px;
transition:color 0.15s ease, background 0.15s ease;
}
.tab-btn[aria-selected="true"]{
background:var(--panel); color:var(--ink);
box-shadow:0 -2px 8px rgba(28,43,58,0.06);
}
.tab-btn[data-c="math"][aria-selected="true"]{border-top:4px solid var(--blue);}
.tab-btn[data-c="sci"][aria-selected="true"]{border-top:4px solid var(--green);}
.tab-btn[data-c="eng"][aria-selected="true"]{border-top:4px solid var(--coral);}
.tab-btn[data-c="hist"][aria-selected="true"]{border-top:4px solid var(--mustard);}
.tab-btn[data-c="math"]:hover{color:var(--blue);}
.tab-btn[data-c="sci"]:hover{color:var(--green);}
.tab-btn[data-c="eng"]:hover{color:var(--coral);}
.tab-btn[data-c="hist"]:hover{color:var(--mustard);}
.panel-wrap{
background:var(--panel); border-radius:0 12px 12px 12px;
box-shadow:var(--shadow); padding:28px 26px;
}
.panel{display:none;}
.panel.active{display:block;}
.panel h3{font-family:var(--mono); font-size:1.05rem; margin:0 0 4px;}
.panel .sub{color:var(--ink-soft); font-size:0.9rem; margin:0 0 18px;}
.tip-list{list-style:none; margin:0; padding:0; display:grid; gap:14px;}
.tip-list li{
padding-left:30px; position:relative; font-size:0.98rem;
}
.tip-list li::before{
content:"→"; position:absolute; left:0; font-family:var(--mono); font-weight:700; color:var(--blue);
}
.tip-list strong{display:block; font-family:var(--mono); font-size:0.92rem; margin-bottom:2px;}

/* ---------- Advice corkboard ---------- */
.corkboard{
background:#DCC9A3;
border-radius:var(--radius);
padding:34px 28px;
display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr));
gap:22px;
box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
}
.note{
background:var(--highlighter); padding:18px 18px 20px; border-radius:2px;
box-shadow:0 8px 14px rgba(0,0,0,0.16);
font-size:0.92rem;
transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.note:nth-child(1){transform:rotate(-2.5deg); background:var(--highlighter);}
.note:nth-child(2){transform:rotate(1.5deg); background:#B7E4C7;}
.note:nth-child(3){transform:rotate(-1.2deg); background:#AFD4F2;}
.note:nth-child(4){transform:rotate(2.4deg); background:#F3B8B0;}
.note:nth-child(5){transform:rotate(-2deg); background:#E3D2F5;}
.note:nth-child(1):hover{transform:rotate(-2.5deg) scale(1.04); box-shadow:0 12px 20px rgba(0,0,0,0.22); z-index:2;}
.note:nth-child(2):hover{transform:rotate(1.5deg) scale(1.04); box-shadow:0 12px 20px rgba(0,0,0,0.22); z-index:2;}
.note:nth-child(3):hover{transform:rotate(-1.2deg) scale(1.04); box-shadow:0 12px 20px rgba(0,0,0,0.22); z-index:2;}
.note:nth-child(4):hover{transform:rotate(2.4deg) scale(1.04); box-shadow:0 12px 20px rgba(0,0,0,0.22); z-index:2;}
